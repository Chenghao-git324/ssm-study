<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书管理</title>
    <style>
        body { font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 40px; }
        h1 { font-size: 20px; }
        table { border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 8px 16px; text-align: left; }
        th { background: #f5f5f5; }
        .bar { margin-top: 16px; }
        button { padding: 6px 14px; margin-right: 8px; cursor: pointer; }
    </style>
</head>
<body>
<h1>图书列表</h1>

<table>
    <thead>
    <tr><th>id</th><th>书名</th><th>价格</th><th>出版日期</th></tr>
    </thead>
    <tbody id="rows"></tbody>
</table>

<div class="bar">
    <button onclick="load(page - 1)">上一页</button>
    <span id="pageInfo"></span>
    <button onclick="load(page + 1)">下一页</button>
</div>

<script>
    const SIZE = 3;
    let page = 1;

    async function load(p) {
        if (p < 1) p = 1;

        const res = await fetch(`/springmvc-demo/books/page?page=${p}&size=${SIZE}`);
        const json = await res.json();

        if (json.code !== 1) {
            alert(json.msg);
            return;
        }

        page = p;

        document.getElementById('rows').innerHTML = json.data.rows.map(b => `
            <tr>
                <td>${b.id}</td>
                <td>${b.name}</td>
                <td>${b.price}</td>
                <td>${b.publishDate == null ? '-' : new Date(b.publishDate).toLocaleDateString()}</td>
            </tr>
        `).join('');

        const totalPages = Math.ceil(json.data.total / SIZE) || 1;
        document.getElementById('pageInfo').textContent =
            `第 ${page} / ${totalPages} 页（共 ${json.data.total} 条）`;
    }

    load(1);
</script>
</body>
</html>
